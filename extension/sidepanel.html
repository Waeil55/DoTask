<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DoTask</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon32.png" alt="">DoTask</div>
    <div class="spacer"></div>
    <div class="site-chip" id="siteChip" title="The tab DoTask works on">No website</div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="do" aria-selected="true"><span class="ico">⚡</span>Do</button>
    <button role="tab" data-view="teach"><span class="ico">🍎</span>Teach</button>
    <button role="tab" data-view="study"><span class="ico">🎓</span>Study</button>
    <button role="tab" data-view="write"><span class="ico">✉️</span>Write</button>
    <button role="tab" data-view="settings"><span class="ico">⚙️</span>Settings</button>
  </nav>
  <main>
    <section class="view active" id="view-do"></section>
    <section class="view" id="view-teach"></section>
    <section class="view" id="view-study"></section>
    <section class="view" id="view-write"></section>
    <section class="view" id="view-settings"></section>
  </main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
