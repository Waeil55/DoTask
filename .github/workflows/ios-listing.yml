# Uploads the App Store listing to App Store Connect: text from mobile/fastlane/metadata (made by
# mobile/tools/make-fastlane-metadata.mjs) and screenshots from mobile/fastlane/screenshots.
# Does not upload a build and does not submit for review.
# Secrets: the four from the iOS workflow, plus REVIEW_PHONE and REVIEWER_GEMINI_KEY (a review-only
# Gemini key). Both go only into the private App Review Information, never into the public listing.
name: iOS App Store listing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane --no-document

      # Secrets go through env (never inline ${{ }} in scripts) so they cannot inject shell code.
      - name: Save the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for name in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set (see mobile/IOS.md)"; exit 1; fi
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/keys"
          # raw .p8 text, or base64 of it
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          fi
          grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/keys/AuthKey.p8" || { echo "::error::ASC_KEY_P8 is not a .p8 key"; exit 1; }
          ruby -rjson -e 'puts JSON.generate({key_id: ENV["ASC_KEY_ID"], issuer_id: ENV["ASC_ISSUER_ID"], key: File.read(ARGV[0]), in_house: false})' \
            "$RUNNER_TEMP/keys/AuthKey.p8" > "$RUNNER_TEMP/keys/asc.json"

      # The review notes keep a {{REVIEWER_GEMINI_KEY}} placeholder in the repository. Fill it here,
      # and refuse to upload if the key is missing or the notes would pass Apple's 4,000 characters.
      - name: Fill in the App Review contact and key
        env:
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
          REVIEWER_GEMINI_KEY: ${{ secrets.REVIEWER_GEMINI_KEY }}
        run: |
          for name in REVIEW_PHONE REVIEWER_GEMINI_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set (see mobile/IOS.md)"; exit 1; fi
          done
          printf '%s\n' "$REVIEW_PHONE" > fastlane/metadata/review_information/phone_number.txt
          ruby -e '
            path = "fastlane/metadata/review_information/notes.txt"
            notes = File.read(path)
            abort "::error::notes.txt has no {{REVIEWER_GEMINI_KEY}} placeholder" unless notes.include?("{{REVIEWER_GEMINI_KEY}}")
            notes = notes.gsub("{{REVIEWER_GEMINI_KEY}}") { ENV["REVIEWER_GEMINI_KEY"].strip }
            abort "::error::A {{placeholder}} is still in the review notes" if notes.include?("{{")
            abort "::error::Review notes are #{notes.strip.length} characters (Apple allows 4000)" if notes.strip.length > 4000
            File.write(path, notes)
            puts "Review notes: #{notes.strip.length}/4000 characters"
          '
          if grep -rq '{{' fastlane/metadata/en-US; then echo "::error::A placeholder would reach the public listing"; exit 1; fi

      - name: Upload listing and screenshots
        run: |
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/keys/asc.json" \
            --app_identifier com.agapecare.dotask \
            --platform ios \
            --app_version 2.1.0 \
            --skip_binary_upload true \
            --skip_app_version_update false \
            --overwrite_screenshots true \
            --metadata_path fastlane/metadata \
            --screenshots_path fastlane/screenshots \
            --submit_for_review false \
            --automatic_release false \
            --run_precheck_before_submit false \
            --force true

      - name: Remove the key and the filled-in notes
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/keys"
          git checkout -- fastlane/metadata/review_information || true
          rm -f fastlane/metadata/review_information/phone_number.txt
